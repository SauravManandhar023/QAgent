# ================================================
# AI SELENIUM TEST GENERATOR - FRAMEWORK CONFIG
# This file is safe to commit to GitHub
# Put your secrets in config.local.properties
# ================================================

# ===== BROWSER SETTINGS =====
browser=chrome
headless=true

# ===== LLM PROVIDER SETTINGS =====
# Options: groq, ollama, claude, openai, gemini, nim, deepseek, fcc
llm.provider=fcc

# ===== GROQ PROVIDER (llm.provider=groq) =====
groq.api.key=YOUR_GROQ_API_KEY_HERE
groq.model=llama-3.3-70b-versatile
groq.base.url=https://api.groq.com/openai/v1/chat/completions
groq.max.tokens=4096
groq.temperature=0.3

# ===== OLLAMA PROVIDER (llm.provider=ollama) =====
# Ollama runs locally — no API key required
ollama.model=qwen2.5-coder:7b
ollama.base.url=http://localhost:11434

# ===== CLAUDE PROVIDER (llm.provider=claude) =====
# claude.api.key=YOUR_CLAUDE_API_KEY_HERE
# claude.model=claude-sonnet-4-20250514
# claude.base.url=https://api.anthropic.com/v1/messages

# ===== OPENAI PROVIDER (llm.provider=openai) =====
# openai.api.key=YOUR_OPENAI_API_KEY_HERE
# openai.model=gpt-4o
# openai.base.url=https://api.openai.com/v1/chat/completions

# ===== GEMINI PROVIDER (llm.provider=gemini) =====
# gemini.api.key=YOUR_GEMINI_API_KEY_HERE
# gemini.model=gemini-2.0-flash
# gemini.base.url=https://generativelanguage.googleapis.com/v1beta/models

# ===== NVIDIA NIM PROVIDER (llm.provider=nim) =====
# nim.api.key=YOUR_NIM_API_KEY_HERE
# nim.model=meta/llama-3.1-70b-instruct
# nim.base.url=https://integrate.api.nvidia.com/v1/chat/completions

# ===== DEEPSEEK PROVIDER (llm.provider=deepseek) =====
# deepseek.api.key=YOUR_DEEPSEEK_API_KEY_HERE
# deepseek.model=deepseek-chat
# deepseek.base.url=https://api.deepseek.com/v1/chat/completions

# ===== FCC ADMIN PROVIDER (llm.provider=fcc) =====
# FCC Admin is a local proxy that manages multiple providers:
# NVIDIA NIM, OpenRouter, Gemini, DeepSeek, Mistral,
# Groq, OpenCode, Ollama, LM Studio, llama.cpp, and more.
# Runs at http://localhost:8082 by default.
# API keys are managed inside FCC Admin — not in this config.
fcc.base.url=http://localhost:8082
fcc.api.key=freecc
# Model auto-discovers from FCC Admin /v1/models on startup.
# Override with a specific model ID if desired:
# fcc.model=anthropic/opencode/deepseek-v4-flash-free

# ===== BASE URL =====
base.url=https://automationexercise.com/

# ===== OUTPUT PATHS =====
output.excel.ui=test-output/excel/ui-test-cases.xlsx
output.excel.api=test-output/excel/api-test-cases.xlsx
output.scripts.ui=src/test/java/generated/ui
output.scripts.api=src/test/java/generated/api
output.logs=test-output/logs/agent.log
output.screenshots=src/test/resources/screenshots

# ===== WAIT SETTINGS =====
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# ===== CACHE SETTINGS =====
cache.enabled=true
cache.offline.mode=false
cache.dir=test-output/cache

# ===== SCRAPER SETTINGS =====
scraper.wait.seconds=3
scraper.headless=true

# ===== AGENT MODEL OVERRIDES =====
# Override in config.local.properties if needed
agent1.model=llama-3.3-70b-versatile
agent1.temperature=0.2
agent1.max.tokens=6000

agent2.model=llama-3.1-8b-instant
agent2.temperature=0.1
agent2.max.tokens=4096

agent3.model=llama-3.1-8b-instant
agent3.temperature=0.1
agent3.max.tokens=2048

agent4.model=llama-3.3-70b-versatile
agent4.max.tokens=4096

agent2.pom.model=llama-3.3-70b-versatile
agent2.test.model=llama-3.3-70b-versatile

# ===== API AUTOMATION =====
api.base.url=https://automationexercise.com
api.excel.output=test-output/excel/api-test-cases.xlsx
api.scripts.output=src/test/java/generated/api

# ===== PIPELINE MODE =====
pipeline.interactive=false
pipeline.run.tests=true
