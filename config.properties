# ================================================
# AI SELENIUM TEST GENERATOR - FRAMEWORK CONFIG
# This file is safe to commit to GitHub
# Put your secrets in config.local.properties
# ================================================

# ===== BROWSER SETTINGS =====
browser=chrome
headless=false

# ===== GROQ AI SETTINGS =====
groq.api.key=YOUR_GROQ_API_KEY_HERE
groq.model=llama-3.3-70b-versatile
groq.max.tokens=4096
groq.temperature=0.3

# ===== BASE URL (override in config.local.properties) =====
base.url=https://the-internet.herokuapp.com/login

# ===== OUTPUT PATHS =====
output.excel.ui=test-output/excel/ui-test-cases.xlsx
output.excel.api=test-output/excel/api-test-cases.xlsx
output.scripts.ui=src/test/java/generated/ui
output.scripts.api=src/test/java/generated/api
output.logs=test-output/logs/agent.log
output.screenshots=src/test/resources/screenshots

# ===== WAIT SETTINGS =====
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# ===== SCRAPER SETTINGS =====
scraper.wait.seconds=3
scraper.headless=false

