name: QAgent CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Use Ollama for CI since it's free and has no rate limits.
  # In practice, swap to Groq with a repo secret:
  #   LLM_PROVIDER: groq
  #   GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  LLM_PROVIDER: groq
  BASE_URL: https://the-internet.herokuapp.com/login
  PIPELINE_INTERACTIVE: "false"
  PIPELINE_RUN_TESTS: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Setup Chrome for Selenium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Build project (compile only)
        run: mvn clean compile -DskipTests -q
        timeout-minutes: 5

      - name: Generate classpath for compiler agent
        run: mvn dependency:build-classpath -Dmdep.outputFile=target/classpath.txt -q
        timeout-minutes: 2

      - name: Run QAgent pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Generate config.local.properties from env vars
          cat > config.local.properties << EOF
          groq.api.key=${GROQ_API_KEY:-dummy_key_for_ollama}
          base.url=$BASE_URL
          pipeline.interactive=$PIPELINE_INTERACTIVE
          pipeline.run.tests=$PIPELINE_RUN_TESTS
          EOF
          mvn exec:java -Dexec.mainClass="com.saurav.agentic.runners.Main"
        timeout-minutes: 20

      - name: Generate Allure report
        if: always()
        run: mvn allure:report -q
        continue-on-error: true
        timeout-minutes: 3

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 7

      - name: Upload generated test files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests
          path: |
            src/test/java/pages/
            src/test/java/generated/ui/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-output/
            target/surefire-reports/
          retention-days: 14

      - name: Check test results
        if: always()
        run: |
          FAILED=$(grep -r 'Failures: [1-9]' target/surefire-reports/*.txt 2>/dev/null || echo "0")
          echo "Test failures: $FAILED"
          if [ -n "$FAILED" ] && [ "$FAILED" != "0" ]; then
            echo "::warning::Some tests failed — review Allure report for details"
          fi
