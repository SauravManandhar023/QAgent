name: QAgent CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Use a simple test URL for CI
  BASE_URL: https://the-internet.herokuapp.com/login
  PIPELINE_INTERACTIVE: "false"
  PIPELINE_RUN_TESTS: "true"
  # Skip the full pipeline in CI - run only unit tests
  SKIP_FULL_PIPELINE: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Reduced timeout for faster CI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build project (compile only)
        run: mvn clean compile -DskipTests -q
        timeout-minutes: 5

      - name: Generate classpath for compiler agent
        run: mvn dependency:build-classpath -Dmdep.outputFile=target/classpath.txt -q
        timeout-minutes: 2

      - name: Run unit tests only (fast CI)
        run: mvn test -q
        timeout-minutes: 10

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
          retention-days: 14

      - name: Check test results
        if: always()
        run: |
          FAILED=$(grep -r 'Failures: [1-9]' target/surefire-reports/*.txt 2>/dev/null || echo "0")
          echo "Test failures: $FAILED"
          if [ -n "$FAILED" ] && [ "$FAILED" != "0" ]; then
            echo "::error::Unit tests failed"
            exit 1
          fi
