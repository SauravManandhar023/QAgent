name: QAgent Full Pipeline Validation

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:      # Allow manual triggering

env:
  # Use Groq for nightly runs via GitHub Secrets
  # In practice, swap to Ollama by setting LLM_PROVIDER: ollama and removing GROQ_API_KEY
  LLM_PROVIDER: groq
  BASE_URL: https://the-internet.herokuapp.com/login
  PIPELINE_INTERACTIVE: "false"
  PIPELINE_RUN_TESTS: "true"

jobs:
  build-and-full-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Increased timeout for full pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Test Groq Model Access (Secure)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "🔐 Testing Groq API key model access (securely)..."

          # Test preferred model first: llama-3.1-70b-versatile
          RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -d '{
              "model": "llama-3.1-70b-versatile",
              "messages": [{"role": "user", "content": "test"}],
              "max_tokens": 5
            }' || echo "NETWORK_ERROR")

          if echo "$RESPONSE" | grep -q '"error"'; then
            ERROR_MSG=$(echo "$RESPONSE" | grep -o '"message":"[^"]*"' | cut -d'"' -f4)
            echo "❌ llama-3.1-70b-versatile: NOT ACCESSIBLE"
            echo "   Reason: $ERROR_MSG"

            echo "--- Testing fallback models ---"

            # Test fallback models in order
            FALLBACK_MODELS=(
              "llama-3.1-8b-instant"       # Fast 8B (current fallback in code)
              "mixtral-8x7b-32768"         # MoE model
              "gemma2-9b-it"               # Google Gemma 2
            )

            SELECTED_MODEL=""
            for model in "${FALLBACK_MODELS[@]}"; do
              RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $GROQ_API_KEY" \
                -d "{
                  \"model\": \"$model\",
                  \"messages\": [{\"role\": \"user\", \"content\": \"Hi\"}],
                  \"max_tokens\": 5
                }" || echo "NETWORK_ERROR")

              if echo "$RESPONSE" | grep -q '"error"'; then
                ERROR_MSG=$(echo "$RESPONSE" | grep -o '"message":"[^"]*"' | cut -d'"' -f4)
                echo "❌ $model: NOT ACCESSIBLE ($ERROR_MSG)"
              else
                echo "✅ $model: ACCESSIBLE"
                SELECTED_MODEL="$model"
                break
              fi
            done

            if [ -n "$SELECTED_MODEL" ]; then
              echo "---"
              echo "🎯 SELECTED MODEL: $SELECTED_MODEL"
              echo "   (will be used to update workflow configuration)"
            else
              echo "---"
              echo "❌ ERROR: No accessible models found!"
              echo "   Please check your Groq account permissions at https://console.groq.com/"
              exit 1
            fi
          else
            echo "✅ llama-3.1-70b-versatile: ACCESSIBLE"
            SELECTED_MODEL="llama-3.1-70b-versatile"
            echo "---"
            echo "🎯 SELECTED MODEL: llama-3.1-70b-versatile"
            echo "   (matches your preference)"
          fi

          # Export selected model for potential use in later steps (optional)
          echo "SELECTED_GROQ_MODEL=$SELECTED_MODEL" >> $GITHUB_ENV

      - name: Setup Chrome for Selenium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build project (compile only)
        run: mvn clean compile -DskipTests -q
        timeout-minutes: 5

      - name: Generate classpath for compiler agent
        run: mvn dependency:build-classpath -Dmdep.outputFile=target/classpath.txt -q
        timeout-minutes: 2

      - name: Run full QAgent pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Generate config.local.properties from env vars
          cat > config.local.properties << EOF
          llm.provider=$LLM_PROVIDER
          groq.api.key=${GROQ_API_KEY}
          base.url=$BASE_URL
          pipeline.interactive=$PIPELINE_INTERACTIVE
          pipeline.run.tests=$PIPELINE_RUN_TESTS
          skip.agent1=false
          run.api.agents=false
          EOF
          mvn exec:java -Dexec.mainClass="com.saurav.agentic.runners.Main"
        timeout-minutes: 30

      - name: Run framework unit tests
        run: mvn test -Pframework-tests -q
        timeout-minutes: 10

      - name: Generate Allure report
        if: always()
        run: mvn site -q
        continue-on-error: true
        timeout-minutes: 5

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 30

      - name: Upload generated test files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests
          path: |
            src/test/java/pages/
            src/test/java/generated/ui/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-output/
            target/surefire-reports/
          retention-days: 30

      - name: Check test results
        if: always()
        run: |
          FAILED=$(grep -r 'Failures: [1-9]' target/surefire-reports/*.txt 2>/dev/null || echo "0")
          echo "Test failures: $FAILED"
          if [ -n "$FAILED" ] && [ "$FAILED" != "0" ]; then
            echo "::warning::Some tests failed — review Allure report for details"
          fi